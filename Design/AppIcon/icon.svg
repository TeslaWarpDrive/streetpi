<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#17162A"/><stop offset="1" stop-color="#0E0D18"/>
    </radialGradient>
    <linearGradient id="ring" x1="260" y1="140" x2="900" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B78CFF"/><stop offset="0.5" stop-color="#8E9BFF"/><stop offset="1" stop-color="#4FE3CF"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="300" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C6CEFF"/><stop offset="1" stop-color="#A3AEF5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- track -->
  <circle cx="512" cy="512" r="350" fill="none" stroke="#201F36" stroke-width="104"/>
  <!-- 80% arc, start at top, clockwise: circumference 2199.1, 80% = 1759.3 -->
  <g transform="translate(1024 0) scale(-1 1) rotate(-90 512 512)">
    <circle cx="512" cy="512" r="350" fill="none" stroke="url(#ring)" stroke-width="104" stroke-linecap="round" stroke-dasharray="1759.3 3000" opacity="0.45" filter="url(#glow)"/>
    <circle cx="512" cy="512" r="350" fill="none" stroke="url(#ring)" stroke-width="104" stroke-linecap="round" stroke-dasharray="1759.3 3000"/>
  </g>
  <!-- house -->
  <path d="M512 300 L728 488 L680 488 L680 680 Q680 712 648 712 L376 712 Q344 712 344 680 L344 488 L296 488 Z"
        fill="url(#house)" stroke="url(#house)" stroke-width="36" stroke-linejoin="round"/>
  <!-- chimney -->
  <rect x="610" y="330" width="52" height="110" rx="14" fill="#B4BEFE"/>
  <!-- pulse: dark underlay then mint -->
  <polyline points="354,590 440,590 474,520 518,664 556,560 580,590 670,590" fill="none" stroke="#0E0D18" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="354,590 440,590 474,520 518,664 556,560 580,590 670,590" fill="none" stroke="#A6E3A1" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
